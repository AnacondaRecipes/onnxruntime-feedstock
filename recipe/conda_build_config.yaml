# Containers from newer standards are used
c_stdlib_version:          # [osx]
  - 13.3                   # [osx]

# CUDA builds need vs2022 (nvcc vcvars discovery fails with vs2019 on workers);
# CPU builds use vs2019
c_compiler:                        # [win]
  - vs2022                         # [win]
  - vs2019                         # [win]
  - vs2022                         # [win]
cxx_compiler:                      # [win]
  - vs2022                         # [win]
  - vs2019                         # [win]
  - vs2022                         # [win]

cuda_compiler_version:
  - 12.9                           # [linux64 or aarch64 or win64]
  - 12.9
  - 13.0                           # [linux64 or aarch64 or win64]

vec_variant:
  - vec
  - novec
ep_variant:
  - "cuda"                         # [linux64 or aarch64 or win64]
  - "cpu"
  - "cuda"                         # [linux64 or aarch64 or win64]

zip_keys:                          # [linux64 or aarch64 or win64]
  -                                # [linux64 or aarch64 or win64]
    - cuda_compiler_version        # [linux64 or aarch64 or win64]
    - ep_variant                   # [linux64 or aarch64 or win64]
    - c_compiler                   # [win]
    - cxx_compiler                 # [win]

# cuDNN host pin (not in the aggregate CBC); the version every CUDA build resolved
cudnn:                             # [linux64 or aarch64 or win64]
  - 9.26.0.51                      # [linux64 or aarch64 or win64]
